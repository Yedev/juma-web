name: 构建并部署到阿里云

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: crpi-pcnycfgdwvbfz2xa.cn-chengdu.personal.cr.aliyuncs.com
  NAMESPACE: ych-dev
  IMAGE: juma-web
  NETWORK: juma-net

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE }}:${{ github.ref_name }}

      - name: 部署到服务器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          envs: REGISTRY,NAMESPACE,IMAGE,NETWORK
          script: |
            # 登录 ACR
            docker login $REGISTRY \
              -u ${{ secrets.ALIYUN_REGISTRY_USER }} \
              -p ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

            # 拉取新镜像
            docker pull $REGISTRY/$NAMESPACE/$IMAGE:latest

            # 创建 Docker 网络（已存在则跳过；保留！juma-web 容器靠它与 juma-nginx 互通，
            # nginx 反代已拆分到独立仓库 juma-nginx 管理）
            docker network create $NETWORK 2>/dev/null || true

            # 准备目录
            mkdir -p /opt/juma-web/data
            mkdir -p /opt/juma-web/logs

            # ── 重启 juma-web 容器 ──
            docker stop juma-web 2>/dev/null || true
            docker rm juma-web 2>/dev/null || true

            docker run -d \
              --name juma-web \
              --restart always \
              --network $NETWORK \
              -e OSS_ACCESS_KEY_ID=${{ secrets.OSS_ACCESS_KEY_ID }} \
              -e OSS_ACCESS_KEY_SECRET=${{ secrets.OSS_ACCESS_KEY_SECRET }} \
              -e OSS_BUCKET=${{ secrets.OSS_BUCKET }} \
              -e OSS_REGION=${{ secrets.OSS_REGION }} \
              -v /opt/juma-web/data:/app/data \
              -v /opt/juma-web/logs:/app/logs \
              $REGISTRY/$NAMESPACE/$IMAGE:latest

            # 清理旧镜像
            docker image prune -f
